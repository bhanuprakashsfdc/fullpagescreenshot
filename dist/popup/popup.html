<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Full Page Screenshot</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div id="app">
    <header>
      <h1>Full Page Screenshot</h1>
    </header>

    <main>
      <section id="capture-section">
        <button id="capture-btn" aria-label="Capture full page screenshot">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
            <circle cx="8.5" cy="8.5" r="1.5"/>
            <polyline points="21 15 16 10 5 21"/>
          </svg>
          Capture Page
        </button>
        <div id="progress-container" class="hidden">
          <div id="progress-bar">
            <div id="progress-fill"></div>
          </div>
          <p id="progress-text">Preparing...</p>
        </div>
      </section>

      <section id="preview-section" class="hidden">
        <div id="toolbar">
          <div class="tool-group">
            <button class="tool-btn active" data-tool="select" aria-label="Select" title="Select">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M3 3l7.07 16.97 2.51-7.39 7.39-2.51L3 3z"/>
              </svg>
            </button>
            <button class="tool-btn" data-tool="pen" aria-label="Pen" title="Pen">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M12 19l7-7 3 3-7 7-3-3z"/>
                <path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18l5-5z"/>
              </svg>
            </button>
            <button class="tool-btn" data-tool="rect" aria-label="Rectangle" title="Rectangle">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
              </svg>
            </button>
            <button class="tool-btn" data-tool="arrow" aria-label="Arrow" title="Arrow">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <line x1="5" y1="12" x2="19" y2="12"/>
                <polyline points="12 5 19 12 12 19"/>
              </svg>
            </button>
            <button class="tool-btn" data-tool="blur" aria-label="Blur" title="Blur">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="12" cy="12" r="10"/>
                <path d="M12 2a10 10 0 0 1 0 20z" fill="currentColor" opacity="0.3"/>
              </svg>
            </button>
          </div>
          <div class="tool-group">
            <input type="color" id="color-picker" value="#ff0000" aria-label="Annotation color">
            <input type="range" id="size-slider" min="1" max="20" value="3" aria-label="Stroke size">
          </div>
          <div class="tool-group">
            <button id="undo-btn" aria-label="Undo" title="Undo">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <polyline points="1 4 1 10 7 10"/>
                <path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/>
              </svg>
            </button>
            <button id="redo-btn" aria-label="Redo" title="Redo">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <polyline points="23 4 23 10 17 10"/>
                <path d="M20.49 15a9 9 0 1 1-2.13-9.36L23 10"/>
              </svg>
            </button>
          </div>
        </div>
        <div id="canvas-container">
          <canvas id="annotation-canvas"></canvas>
        </div>
        <div id="export-actions">
          <button id="download-btn" aria-label="Download image">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
              <polyline points="7 10 12 15 17 10"/>
              <line x1="12" y1="15" x2="12" y2="3"/>
            </svg>
            Download
          </button>
          <button id="copy-btn" aria-label="Copy to clipboard">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="9" y="9" width="13" height="13" rx="2" ry="2"/>
              <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
            </svg>
            Copy
          </button>
        </div>
      </section>
    </main>

    <footer>
      <p>Privacy-first. No login. No tracking.</p>
    </footer>
  </div>

  <script src="popup.js" type="module"></script>
</body>
</html>
